<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miori Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

:root{
--bg:#fff9fc;
--grid:#f8dce8;
--window:#ffffff;
--title:#ffe1ee;
--border:#f3bfd4;
--text:#8d6d7d;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Mitr',sans-serif;
background:var(--bg);

background-image:
linear-gradient(var(--grid) 1px, transparent 1px),
linear-gradient(90deg,var(--grid) 1px, transparent 1px);

background-size:24px 24px;

padding:25px;
}

.container{
max-width:430px;
margin:auto;
}

.os-title{
font-family:'Press Start 2P';
font-size:10px;
color:#c994aa;
margin-bottom:20px;
}

.logo{
width:120px;
height:120px;

margin:auto;

border-radius:50%;
overflow:hidden;

background:white;

border:3px solid var(--border);

box-shadow:
0 10px 20px rgba(255,182,193,.15);
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

.shop-name{
text-align:center;
margin-top:18px;
font-size:34px;
font-weight:600;
color:var(--text);
}

.shop-desc{
text-align:center;
margin-top:8px;
font-size:14px;
color:#ab8698;
line-height:1.8;
}

.window{
margin-top:25px;

background:white;

border:2px solid var(--border);

border-radius:20px;

overflow:hidden;

box-shadow:
0 10px 20px rgba(255,192,203,.10);
}

.titlebar{
height:42px;

background:var(--title);

display:flex;
align-items:center;

padding:0 15px;

font-family:'Press Start 2P';
font-size:9px;

color:#b07f93;
}

.banner{
height:220px;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

.payment-btn{
margin-top:22px;

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 22px;

background:white;

border:2px solid var(--border);

border-radius:20px;

text-decoration:none;

color:var(--text);

box-shadow:
0 8px 20px rgba(255,192,203,.08);

transition:.2s;
}

.payment-btn:hover{
transform:translateY(-2px);
}

.arrow{
font-size:20px;
}

.divider{
text-align:center;
margin:25px 0;
color:#d7a3b7;
}

.welcome{
padding:25px;
text-align:center;
}

.welcome h2{
font-size:22px;
color:var(--text);
margin-bottom:10px;
}

.welcome p{
color:#a68192;
line-height:1.8;
}

.footer{
margin-top:25px;
text-align:center;
font-size:22px;
color:#d19aae;
}

</style>
</head>
<body>

<div class="container">

<div class="os-title">
MIORI OS
</div>

<div class="logo">
<img src="images/logo.png">
</div>

<div class="shop-name">
Miori Shop
</div>

<div class="shop-desc">
ร้านเล็ก ๆ ที่ตั้งใจทำทุกอย่างให้น่ารัก
</div>

<div class="window">

<div class="titlebar">
Banner.jpg
</div>

<div class="banner">
<img src="images/banner.jpg">
</div>

</div>

<a href="payment.html" class="payment-btn">

<span>Payment.exe</span>

<span class="arrow">➜</span>

</a>

<div class="divider">
──────── ♡ ────────
</div>

<div class="window">

<div class="titlebar">
Welcome.exe
</div>

<div class="welcome">

<h2>🌸 Welcome to Miori Shop</h2>

<p>
ขอบคุณที่อุดหนุนร้านเล็ก ๆ ของเรานะคะ 💕
</p>

</div>

</div>

<div class="footer">
♡ Thank You ♡
</div>

</div>

</body>
</html>
