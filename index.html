<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miori OS</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Mitr',sans-serif;
}

body{
background:#e7e2ff;
background-image:
radial-gradient(#d2ccff 2px, transparent 2px);
background-size:25px 25px;
padding:20px;
min-height:100vh;
}

.container{
max-width:430px;
margin:auto;
}

.window{
background:#f8f7ff;
border:4px solid #cfc8ff;
border-radius:12px;
padding:15px;
box-shadow:8px 8px 0 #cfc8ff;
}

.header{
text-align:center;
font-size:18px;
font-weight:600;
margin-bottom:15px;
color:#7670b5;
}

.logo-box{
width:120px;
height:120px;
margin:auto;
background:#fff;
border:4px solid #d3ccff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
color:#8d86d9;
}

.shop-name{
text-align:center;
font-size:32px;
font-weight:700;
margin-top:15px;
color:#746dc0;
}

.subtitle{
text-align:center;
margin-top:8px;
color:#8d86d9;
font-size:14px;
}

.banner{
margin-top:20px;
height:180px;
background:#d7d1ff;
border:4px solid #cfc8ff;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
color:#746dc0;
}

.menu-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px;
}

.pixel-btn{
background:white;
border:4px solid #d3ccff;
border-radius:10px;
padding:18px;
text-decoration:none;
text-align:center;
color:#746dc0;
font-weight:600;
box-shadow:4px 4px 0 #cfc8ff;
transition:.2s;
}

.pixel-btn:hover{
transform:translateY(-3px);
}

.payment-btn{
display:block;
margin-top:20px;
background:#ffcae3;
border:4px solid #ffb4d7;
border-radius:15px;
padding:18px;
text-align:center;
text-decoration:none;
font-size:18px;
font-weight:700;
color:#8a5670;
box-shadow:6px 6px 0 #f3b6d1;
}

.footer{
margin-top:25px;
text-align:center;
color:#8d86d9;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="window">

<div class="header">
💻 Miori OS v1.0
</div>

<div class="logo-box">
MIORI
</div>

<div class="shop-name">
Miori Shop 🎀
</div>

<div class="subtitle">
ร้านเล็ก ๆ ที่ตั้งใจทำทุกอย่างให้น่ารักและเป็นคุณ ♡
</div>

<div class="banner">
BANNER 1122×495
</div>

<a href="payment.html" class="payment-btn">
💳 ช่องทางการโอนเงิน
</a>

<div class="menu-grid">

<a href="#" class="pixel-btn">
📋 เช็คคิว
</a>

<a href="#" class="pixel-btn">
🖼 ผลงาน
</a>

<a href="#" class="pixel-btn">
🛍 บริการ
</a>

<a href="#" class="pixel-btn">
💌 ติดต่อ
</a>

</div>

<div class="footer">
♡ Thank you for supporting my small shop ♡
</div>

</div>

</div>

</body>
</html>
